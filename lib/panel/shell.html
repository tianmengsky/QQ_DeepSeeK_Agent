<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>qq-bridge 运维面板</title>
<style>
/* 国风平面：宣纸底 + 墨色细线 + 朱砂/古金/石绿/青金做语义色。
   双主题：data-theme=day（宣纸昼）/ night（墨夜），全部走 CSS 变量，切换只换一处。

   版式原则（2026-10-31 改版）：
   · 顶栏只放"现在整体怎么样"，一眼扫完；
   · 判断流是主角，摆在第一屏左上，自己滚动，不把整页顶长；
   · 卡片之间靠留白和一条细线分区，不再层层套边框；
   · 会话表是宽表，单独占一整行，不塞进窄栏里挤成竖排。 */

:root{
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"SimSun","Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  --r-card:14px; --r-ctl:9px; --r-pill:999px;
}

/* —— 昼：宣纸 —— */
:root[data-theme=day]{
  color-scheme:light;
  --bg:#EFE7D8; --bg-2:#E5DAC6;
  --panel:#FBF6EA; --panel2:#F3EAD9; --panel3:#EADFC9;
  --line:#DED0B7; --line2:#BCA886; --ink-line:#4A3F32;
  --text:#2C2416; --muted:#6C5E4C; --dim:#94856E;
  --err:#C4442F; --warn:#A8701A; --ok:#4B7F4A; --info:#26619C;
  --accent:#C44E3A; --gold:#D4A84B; --jade:#5B8C5A; --lapis:#26619C;
  --tint-err:rgba(196,68,47,.10); --tint-warn:rgba(212,168,75,.20);
  --tint-ok:rgba(91,140,90,.12); --tint-info:rgba(38,97,156,.09);
  --shadow:0 1px 2px rgba(74,63,50,.10),0 6px 16px -12px rgba(74,63,50,.35);
  --shadow-sm:0 1px 0 rgba(74,63,50,.12);
  --glow:0 0 0 3px rgba(196,78,58,.20);
  --paper:
    radial-gradient(ellipse at 16% 8%, rgba(139,125,107,.09), transparent 54%),
    radial-gradient(ellipse at 84% 82%, rgba(139,125,107,.07), transparent 56%);
}

/* —— 夜：墨夜 —— */
:root[data-theme=night]{
  color-scheme:dark;
  --bg:#15191F; --bg-2:#111419;
  --panel:#1C2129; --panel2:#232932; --panel3:#2A313C;
  --line:#333B47; --line2:#4A5464; --ink-line:#8C8472;
  --text:#E8E0D1; --muted:#A2967F; --dim:#7A7161;
  --err:#E27A66; --warn:#E0B45C; --ok:#7FB37C; --info:#7FAFDA;
  --accent:#D9614A; --gold:#E0B45C; --jade:#7FB37C; --lapis:#7FAFDA;
  --tint-err:rgba(217,97,74,.15); --tint-warn:rgba(224,180,92,.14);
  --tint-ok:rgba(127,179,124,.13); --tint-info:rgba(127,175,218,.13);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 20px -14px rgba(0,0,0,.7);
  --shadow-sm:0 1px 0 rgba(0,0,0,.4);
  --glow:0 0 0 3px rgba(217,97,74,.26);
  --paper:
    radial-gradient(ellipse at 16% 8%, rgba(224,180,92,.05), transparent 56%),
    radial-gradient(ellipse at 84% 82%, rgba(127,175,218,.05), transparent 58%);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:var(--paper);
  background-attachment:fixed;color:var(--text);
  font:13.5px/1.62 var(--sans);-webkit-font-smoothing:antialiased;
  transition:background-color .2s ease,color .2s ease}
a{color:var(--info);text-decoration:none;border-bottom:1px solid currentColor;opacity:.9}
code,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::selection{background:var(--gold);color:#2C2416}

/* —— 顶栏 —— */
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding:9px 22px;background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:15px;font-weight:700;
  letter-spacing:.05em;white-space:nowrap}
.seal{width:24px;height:24px;flex:0 0 auto;display:grid;place-items:center;border-radius:7px;
  background:var(--accent);color:#FBF4E6;font-family:var(--serif);font-size:14px;font-weight:700}
.brand #build{color:var(--dim);font-weight:400;font-family:var(--mono);font-size:11px;letter-spacing:0}

.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:var(--r-pill);
  border:1px solid var(--line2);background:var(--panel2);font-size:12px;color:var(--muted)}
.pill b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
.pill[data-tone=ok]::before{background:var(--ok)}
.pill[data-tone=warn]::before{background:var(--gold)}
.pill[data-tone=err]::before{background:var(--err)}
.spacer{flex:1}
.stamp{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
label.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;
  user-select:none;white-space:nowrap}
label.chk input{accent-color:var(--accent);width:13px;height:13px;margin:0}

/* —— 控件 —— */
button{font:inherit;font-size:12.5px;padding:4px 11px;border-radius:var(--r-ctl);cursor:pointer;
  border:1px solid var(--line2);background:var(--panel2);color:var(--text);transition:background .12s ease,border-color .12s ease}
button:hover{background:var(--panel3)}
button:focus-visible{outline:none;box-shadow:var(--glow)}
button.primary{background:var(--accent);border-color:var(--accent);color:#FBF4E6;font-weight:600}
button.primary:hover{filter:brightness(1.07)}
button.danger{background:transparent;border-color:var(--err);color:var(--err)}
button.danger:hover{background:var(--tint-err)}
button.theme{min-width:44px;font-family:var(--serif)}
button.mini{padding:1px 8px;font-size:11.5px}
button.mini.danger{border-color:var(--err);color:var(--err)}
button:disabled{opacity:.45;cursor:default}

/* —— 主体：一列，内部再分两栏 —— */
main{max-width:1560px;margin:0 auto;padding:16px 22px 80px;display:grid;gap:14px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);align-items:start}
@media (max-width:1120px){.grid{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card-head{margin:0;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:10px 14px;border-bottom:1px solid var(--line);
  font-family:var(--serif);font-size:13.5px;font-weight:700;letter-spacing:.04em;color:var(--text)}
.card-head::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--accent);
  transform:rotate(45deg);flex:none}
.card-head .muted{font-family:var(--sans);font-weight:400;font-size:11.5px;letter-spacing:0}
.card-body{padding:12px 14px}
.empty{color:var(--dim);font-size:12.5px;padding:6px 0}
.sub-head{display:flex;align-items:center;gap:8px;margin:16px 0 7px;font-family:var(--serif);
  font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em}
.card-body>.sub-head:first-child{margin-top:0}
.errbox{display:grid;gap:5px;padding:9px 11px;border-radius:10px;border:1px solid var(--line2);
  background:var(--tint-err)}
.mono{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word;
  max-height:220px;overflow:auto;color:var(--muted)}

/* —— 判定条 —— */
#verdicts{display:grid;gap:8px}
#verdicts:empty{display:none}
.v{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;
  padding:9px 14px;border-radius:12px;border:1px solid var(--line);
  border-left:3px solid var(--tone,var(--line2));background:var(--panel)}
.v[data-level=error]{--tone:var(--err);background:var(--tint-err)}
.v[data-level=warn]{--tone:var(--gold);background:var(--tint-warn)}
.v[data-level=info]{--tone:var(--info);background:var(--tint-info)}
.v[data-level=ok]{--tone:var(--ok);background:var(--tint-ok)}
.v .label{font-family:var(--serif);font-weight:700;font-size:13px;white-space:nowrap}
.v .detail{color:var(--muted);font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.v-link{border:0;background:none;padding:0;color:var(--info);font-size:12px;cursor:pointer}
.v-link:hover{background:none;text-decoration:underline}

/* —— 判断流 —— */
.filters{display:flex;flex-wrap:wrap;gap:5px;font-family:var(--sans);font-weight:400}
.filters button{padding:1px 9px;font-size:11.5px;border-radius:var(--r-pill);border-color:transparent;
  background:transparent;color:var(--muted)}
.filters button:hover{background:var(--panel2);color:var(--text)}
.filters button[data-active=true]{background:var(--panel3);border-color:var(--line2);color:var(--text);font-weight:600}

#judgement{display:grid;gap:0;padding:0;min-height:240px;max-height:min(62vh,560px);overflow:auto;align-content:start}
.jd{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:9px 14px;
  border-bottom:1px solid var(--line);border-left:3px solid transparent}
.jd:last-child{border-bottom:0}
.jd:hover{background:var(--panel2)}
.jd[data-tone=fail]{border-left-color:var(--err)}
.jd[data-tone=skip]{border-left-color:var(--line2)}
.jd[data-tone=speak]{border-left-color:var(--ok)}
.jd[data-tone=other]{border-left-color:var(--lapis)}
.jd-time{font-family:var(--mono);font-size:11px;color:var(--dim);padding-top:2px;white-space:nowrap}
.jd-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:2px}
.jd-site{font-family:var(--serif);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.jd-verdict{font-size:11.5px;font-weight:600;padding:0 7px;border-radius:var(--r-pill);
  border:1px solid currentColor;white-space:nowrap}
.jd[data-tone=fail] .jd-verdict{color:var(--err)}
.jd[data-tone=skip] .jd-verdict{color:var(--dim)}
.jd[data-tone=speak] .jd-verdict{color:var(--ok)}
.jd[data-tone=other] .jd-verdict{color:var(--info)}
.jd-meta{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.jd-subject{font-size:12.5px;color:var(--text);overflow-wrap:anywhere}
.jd-subject::before{content:"判：";color:var(--dim);font-family:var(--serif)}
.jd-reason{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;margin-top:1px}
.jd-reason::before{content:"因：";color:var(--dim);font-family:var(--serif)}
.jd-raw{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:pre-wrap;
  overflow-wrap:anywhere;max-height:3.6em;overflow:hidden;margin-top:3px;
  border-left:2px solid var(--line);padding-left:7px}
.jd-raw[data-open=true]{max-height:none;color:var(--muted)}

/* —— 运行状态：紧凑键值 —— */
.kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px 12px;margin:0;font-size:12.5px}
.kv dt{color:var(--dim);font-family:var(--serif);letter-spacing:.04em;white-space:nowrap}
.kv dd{margin:0;color:var(--text);min-width:0;overflow-wrap:anywhere}
.kv .sub{color:var(--muted);font-size:11.5px;line-height:1.55}

/* —— 表格 —— */
.tbl-wrap{overflow:auto;max-height:min(58vh,520px)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;z-index:1;text-align:left;font-weight:600;color:var(--muted);white-space:nowrap;
  padding:7px 12px;background:var(--panel2);border-bottom:1px solid var(--line2);
  font-family:var(--serif);letter-spacing:.04em}
.tbl td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:hover td{background:var(--panel2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{width:1%;white-space:nowrap}
.tbl .key{font-family:var(--mono);color:var(--text);white-space:nowrap}
.tbl .wrap{max-width:520px;overflow-wrap:anywhere;color:var(--muted)}

/* —— tab：分段控件 —— */
.tabs{display:flex;gap:2px;padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--line);
  flex-wrap:wrap}
.tabs button{border-radius:var(--r-ctl);border:1px solid transparent;background:transparent;color:var(--muted);
  font-family:var(--serif);letter-spacing:.05em;padding:4px 13px}
.tabs button:hover{background:var(--panel3);color:var(--text)}
.tabs button[data-active=true]{background:var(--panel);border-color:var(--line2);color:var(--text);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:1px 9px;border-radius:var(--r-pill);
  border:1px solid var(--line2);background:var(--panel2);font-size:11.5px;color:var(--muted)}
.chip b{color:var(--text);font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.chip[data-bad=true]{border-color:var(--err);background:var(--tint-err);color:var(--err)}
.chip[data-bad=true] b{color:var(--err)}
.chip[data-warn=true]{border-color:var(--gold);background:var(--tint-warn)}
.chip[data-warn=true] b{color:var(--warn)}
.chip[data-tone=bad]{border-color:var(--err);color:var(--err)}

/* —— 原始 JSON —— */
details.raw>summary{padding:10px 14px;cursor:pointer;font-size:12px;color:var(--muted);
  font-family:var(--serif);letter-spacing:.04em;list-style:none}
details.raw>summary::-webkit-details-marker{display:none}
details.raw>summary::before{content:"▸ ";color:var(--accent)}
details.raw[open]>summary::before{content:"▾ "}
details.raw>summary:hover{color:var(--text)}
details.raw pre{margin:0;padding:12px 14px;max-height:420px;overflow:auto;font-size:11px;
  font-family:var(--mono);color:var(--muted);border-top:1px solid var(--line);
  white-space:pre-wrap;word-break:break-all}

footer{max-width:1560px;margin:0 auto;padding:0 22px 40px;font-size:11.5px;color:var(--dim)}
#banner{display:none;margin:14px 22px 0;padding:9px 13px;border-radius:10px;
  border:1px solid var(--err);background:var(--tint-err);color:var(--err);font-size:12.5px}
#banner[data-show=true]{display:block}

/* —— 设置 / 记忆 —— */
.grp{margin-bottom:18px}
.grp>h3{margin:0 0 2px;font-family:var(--serif);font-size:13.5px;letter-spacing:.04em;
  display:flex;align-items:center;gap:8px}
.grp>h3::before{content:'';width:7px;height:7px;background:var(--accent);transform:rotate(45deg);
  border-radius:2px;flex:none}
.grp>.note{margin:0 0 10px;color:var(--dim);font-size:11.5px;line-height:1.6}
.field{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,300px);gap:6px 18px;
  align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:none}
.field .fl{font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.field .fh{color:var(--dim);font-size:11.5px;line-height:1.55;margin-top:2px;max-width:58em}
.field .fc{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:0}
.field input[type=text],.field input[type=number],.field select{
  width:100%;min-width:0;max-width:300px;padding:5px 9px;border-radius:var(--r-ctl);
  border:1px solid var(--line2);background:var(--panel2);color:var(--text);
  font:inherit;font-size:12.5px;font-family:var(--mono)}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow)}
.field .unit{color:var(--dim);font-size:11.5px;white-space:nowrap}
.field[data-dirty=true]{background:var(--tint-warn);border-radius:8px}
.field[data-bad=true] .fh{color:var(--err)}
.badge{font-size:10.5px;padding:0 7px;border-radius:var(--r-pill);border:1px solid var(--gold);
  color:var(--warn);background:var(--tint-warn);white-space:nowrap}
.badge.off{border-color:var(--line2);color:var(--dim);background:transparent}
.acts{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.err-text{color:var(--err)}
.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:2px 0 14px}
.actions .hint{color:var(--dim);font-size:11.5px}
textarea{width:100%;min-height:240px;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--text);font-family:var(--mono);font-size:12px;
  line-height:1.7;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow)}
.ed{margin-bottom:14px;border:1px solid var(--line);border-radius:10px;padding:0 12px}
.ed>summary{cursor:pointer;padding:9px 0;font-family:var(--serif);font-size:13px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
.ed>summary::-webkit-details-marker{display:none}
.ed>summary::before{content:"▸";color:var(--accent);font-size:11px}
.ed[open]>summary::before{content:"▾"}
.ed .meta{color:var(--dim);font-size:11px;font-family:var(--mono)}
.ed .open-hint{margin-left:auto;flex:none}
.ed>textarea{margin-bottom:12px}
.memlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;max-height:200px;overflow:auto}
.memlist button{font-family:var(--mono);font-size:11px;padding:2px 9px}
.memlist button[data-active=true]{border-color:var(--accent);color:var(--accent);background:var(--tint-err)}
#flash{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:20;display:none;
  padding:8px 16px;border-radius:var(--r-pill);border:1px solid var(--ok);background:var(--panel);
  color:var(--text);font-size:12.5px;box-shadow:var(--shadow)}
#flash[data-show=true]{display:block}
#flash[data-tone=bad]{border-color:var(--err);color:var(--err)}
#session-detail[data-show=false]{display:none}
#sessions button.keybtn{font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:6px;
  border:1px solid transparent;background:none;color:var(--text)}
#sessions button.keybtn:hover{border-color:var(--line2);background:var(--panel3)}
#sessions button.keybtn[data-active=true]{border-color:var(--accent);color:var(--accent)}
.msglist{display:flex;flex-direction:column;gap:5px;max-height:420px;overflow:auto;
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2)}
.msg{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px;font-size:12.5px;align-items:baseline}
.msg .who{color:var(--dim);font-family:var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .text{color:var(--text);overflow-wrap:anywhere}
.msg .at{color:var(--dim);font-family:var(--mono);font-size:10.5px;white-space:nowrap}
.msg[data-bot=true] .who{color:var(--accent)}
.msg .meta{color:var(--dim);font-size:11px;margin-left:6px}

@media (max-width:720px){
  main{padding:12px 12px 64px;gap:11px}
  header{padding:8px 12px;gap:8px}
  .brand{font-size:14px}
  .stamp{display:none}
  #banner{margin:12px 12px 0}
  .v{grid-template-columns:minmax(0,1fr)}
  .field{grid-template-columns:minmax(0,1fr)}
  .field .fc{justify-content:flex-start}
  .field input[type=text],.field input[type=number],.field select{max-width:none}
  #judgement{max-height:none}
  .jd{grid-template-columns:minmax(0,1fr)}
  .jd-time{padding-top:0}
}
</style>
<script>
/* 主题要在首帧之前定下来，否则白底会闪一下。?theme=day|night 可强制；记住上次选择。 */
(function () {
  var KEY = 'qq-panel-theme';
  var forced = new URLSearchParams(location.search).get('theme');
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (error) { saved = null; }
  var pick = forced === 'day' || forced === 'night' ? forced
    : saved === 'day' || saved === 'night' ? saved
    : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night';
  document.documentElement.dataset.theme = pick;
})();
</script>
</head>
<body>
<header>
  <div class="brand"><span class="seal">桥</span><span>qq-bridge</span><span id="build">—</span></div>
  <div class="pills">
    <span class="pill" id="pill-hosting">托管 <b>—</b></span>
    <span class="pill" id="pill-login">QQ <b>—</b></span>
    <span class="pill" id="pill-queue">队列 <b>—</b></span>
    <span class="pill" id="pill-aux">辅助层 <b>—</b></span>
  </div>
  <div class="spacer"></div>
  <label class="chk"><input type="checkbox" id="auto" checked> 30 秒自动</label>
  <span class="stamp" id="stamp">—</span>
  <button id="refresh">刷新</button>
  <button class="theme" id="theme" aria-label="切换昼夜主题">昼</button>
  <button id="toggle">托管</button>
</header>
<div id="banner"></div>
<main>
  <section id="verdicts" aria-live="polite"></section>

  <div class="grid">
    <section class="card">
      <div class="card-head">判断流 <span class="muted" id="judge-note"></span>
        <div class="spacer"></div>
        <div class="filters" id="judge-filters"></div>
      </div>
      <div id="judgement"><div class="empty" style="padding:14px">等待数据…</div></div>
    </section>

    <section class="card">
      <div class="card-head">运行状态</div>
      <div class="card-body"><dl class="kv" id="recent"></dl></div>
    </section>
  </div>

  <section class="card">
    <div class="card-head">会话 <span class="muted" id="session-summary"></span>
      <div class="spacer"></div>
      <label class="chk"><input type="checkbox" id="all-sessions"> 显示全部（含 24 小时没动静的）</label>
    </div>
    <div class="tbl-wrap"><table class="tbl" id="sessions"></table></div>
  </section>

  <section class="card" id="session-detail" data-show="false">
    <div class="card-head">会话详情 <span class="muted" id="session-key"></span>
      <div class="spacer"></div>
      <button class="mini" id="session-close">收起</button>
    </div>
    <div class="card-body" id="session-body"></div>
  </section>

  <section class="card">
    <nav class="tabs" id="tabs">
      <button data-tab="tasks" data-active="true">任务</button>
      <button data-tab="delivery">投递</button>
      <button data-tab="failures">失败面</button>
      <button data-tab="settings">设置</button>
      <button data-tab="memory">记忆</button>
    </nav>
    <div class="card-body" id="tab-body"><div class="empty">等待数据…</div></div>
  </section>

  <details class="card raw">
    <summary>原始 JSON（自检接口原样，未美化）</summary>
    <pre id="raw">—</pre>
  </details>
</main>
<div id="flash"></div>
<footer>
  <span id="foot">本页与桥接同生共死：桥接挂了，这个页面也打不开。真正的告警仍走 QQ。</span>
</footer>
<script type="module">
/*__VERDICTS__*/
/*__APP__*/
</script>
</body>
</html>
